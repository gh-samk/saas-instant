# Control-Stack von saas-instant (CRM/Verwaltung) zum Selbst-Hosten:
#   control-db  (Postgres), control-api (NestJS), control-web (nginx + Oberfläche).
#
#   ./install.sh                        # empfohlen: legt installations/<slug>/.env an
#   -- oder von Hand --
#   cp apps/control/.env.example .env   # Werte eintragen, mindestens die unten
#                                       # mit Pflicht-Hinweis
#   docker compose up -d --build
#
# Mehrere Verwaltungen (Modus portal): Jede hat ihr eigenes Projekt
# (COMPOSE_PROJECT_NAME), damit Datenbank-Volume, Netz und Container getrennt
# bleiben. Aufruf: docker compose --env-file installations/<slug>/.env up -d
# (bin/saas-instant up <slug> erledigt das). Der Dienstname control-api ist
# fest, weil src/common/timezone.spec.ts ihn prüft.
#
# Die Oberfläche steht danach auf http://localhost:${CONTROL_WEB_PORT:-8080}.
# Für den Betrieb hinter TLS (Traefik, Caddy, nginx) die Domain auf control-web
# legen und CONTROL_APP_URL / CONTROL_RP_ID passend setzen. Die Variante für
# Coolify steht in reference/docker-compose.control.coolify.yml; das Template
# der Instanzen, die diese Verwaltung anlegt, in docker-compose.coolify.yml.
#
# HARTE REGEL R1: Die Verwaltung kennt GENAU EINE Datenbank (`control`). Es gibt
# keine zweite DATABASE_URL, keinen SQL-Zugang zu Kundeninstanzen und keinen
# Codepfad, der ein Deployment oder eine Datenbank löscht.
#
# Beim Start wendet control-api die Migrationen an
# (apps/control/docker-entrypoint.sh -> prisma migrate deploy).

services:
  control-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: control
      POSTGRES_USER: control
      POSTGRES_PASSWORD: ${CONTROL_POSTGRES_PASSWORD:?CONTROL_POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - control-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control -d control"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  control-api:
    build:
      context: .
      dockerfile: apps/control/Dockerfile
    environment:
      # ZEITZONE DES CONTAINERS. Gespeichert werden Tagesdaten ohne Uhrzeit;
      # welcher Tag "heute" ist, entscheidet die Zeitzone des Prozesses. In UTC
      # läge der Tag zwischen Mitternacht und dem Versatz der Betreiberzone
      # beim VORTAG. Über APP_TIMEZONE auf die Zone des Betreibers stellen
      # (IANA-Name). node:22-alpine braucht dafür kein tzdata-Paket.
      TZ: ${APP_TIMEZONE:-Europe/Berlin}
      APP_GIT_SHA: ${SOURCE_COMMIT:-}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-}
      DATABASE_URL: postgresql://control:${CONTROL_POSTGRES_PASSWORD}@control-db:5432/control?schema=public
      NODE_ENV: production
      PORT: "3001"
      MANIFEST_PATH: ${MANIFEST_PATH:-/app/saas-instant.manifest.yaml}
      # Bindung an genau eine Software: install.sh schreibt den Slug in die .env.
      # control-api bricht den Start ab, wenn er vom Manifest (product.slug) oder
      # von der in der Datenbank gespeicherten Bindung abweicht. Leer = keine Prüfung gegen die Umgebung.
      SAAS_INSTANT_SLUG: ${SAAS_INSTANT_SLUG:-}
      CONTROL_APP_URL: ${CONTROL_APP_URL:-http://localhost:8080}
      CONTROL_RP_ID: ${CONTROL_RP_ID:-localhost}
      CONTROL_RP_NAME: ${CONTROL_RP_NAME:-Verwaltung}
      CONTROL_TOTP_ISSUER: ${CONTROL_TOTP_ISSUER:-Verwaltung}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss gesetzt sein}
      CONTROL_CONFIG_KEY: ${CONTROL_CONFIG_KEY:?CONTROL_CONFIG_KEY muss gesetzt sein}
      # 1 = Secure-Cookies (nur hinter TLS). Lokal über http auf 0 stellen.
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      # Anzahl der Proxys vor der API (control-web = 1, plus ein TLS-Proxy = 2).
      CONTROL_TRUST_PROXY: ${CONTROL_TRUST_PROXY:-1}
      # Anmeldung über das Portal (SSO). `single` = lokale Anmeldung.
      AUTH_MODE: ${AUTH_MODE:-single}
      PORTAL_ISSUER: ${PORTAL_ISSUER:-}
      PORTAL_INTERNAL_URL: ${PORTAL_INTERNAL_URL:-}
      PORTAL_CLIENT_ID: ${PORTAL_CLIENT_ID:-}
      PORTAL_CLIENT_SECRET: ${PORTAL_CLIENT_SECRET:-}
      PORTAL_POST_LOGOUT_URI: ${PORTAL_POST_LOGOUT_URI:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_ERZWINGEN: ${SMTP_TLS_ERZWINGEN:-1}
      CONTROL_INQUIRY_KEY: ${CONTROL_INQUIRY_KEY:-}
      CONTROL_INQUIRY_RECIPIENT: ${CONTROL_INQUIRY_RECIPIENT:-}
      # Eintraege von rechts in X-Forwarded-For bis zum Formularbesucher auf dem
      # oeffentlichen Anfrageweg (Rueckfall; Vorrang hat x-sender-ip der Webseite).
      # Hier: Webseiten-nginx -> control-web -> API = 2, ohne zweiten Traefik. Die
      # Coolify-Referenz hat zwei Traefik in der Kette und deshalb 4; steht vor
      # dem Webseiten-nginx ein TLS-Proxy, ist es 3. Siehe docs/installation.md.
      CONTROL_INQUIRY_TRUST_PROXY: ${CONTROL_INQUIRY_TRUST_PROXY:-2}
      CONTROL_SCHEDULE_ENABLED: ${CONTROL_SCHEDULE_ENABLED:-ja}

      # --- Optionale Werte: Durchreichen unter dem Namen, den der Code liest --
      # Schreibweise `NAME:` ohne Wert = Durchreichen. Steht der Wert in der
      # .env (oder in der Umgebung), erreicht er den Container; fehlt er, bleibt
      # die Variable im Container UNGESETZT und die Vorgabe des Codes (oder des
      # Manifests) gilt. Ein leerer String wäre etwas anderes als "nicht gesetzt".
      # Rangfolge je Wert: Umgebung, Manifest, Vorgabe. Beschreibung der Werte:
      # apps/control/.env.example.

      # Instanzen und Coolify. Ohne CONTROL_COOLIFY_TOKEN bleibt die
      # Instanzverwaltung sichtbar aus (503).
      CONTROL_COOLIFY_API_URL:
      CONTROL_COOLIFY_TOKEN:
      CONTROL_COOLIFY_PROJECT_UUID:
      CONTROL_COOLIFY_SERVER_UUID:
      CONTROL_COOLIFY_DEPLOY_KEY_UUID:
      CONTROL_COOLIFY_REPO:
      CONTROL_COOLIFY_BRANCH:
      CONTROL_COOLIFY_COMPOSE:
      CONTROL_COOLIFY_UMGEBUNG:
      CONTROL_COOLIFY_OWN_APPLICATIONS:
      CONTROL_INSTANCE_BASE_DOMAIN:
      CONTROL_INSTANCE_PREFIX:
      CONTROL_INSTANCE_SETUP_PATH:
      CONTROL_INSTANCE_SETUP_STATUS_PATH:
      CONTROL_INSTANCE_METRICS_PATH:
      CONTROL_INSTANCE_SMTP_HOST:
      CONTROL_INSTANCE_SMTP_PORT:
      CONTROL_INSTANCE_SMTP_USER:
      CONTROL_INSTANCE_SMTP_PASS:
      CONTROL_INSTANCE_SMTP_FROM:
      CONTROL_METRICS_FETCH_ENABLED:
      CONTROL_RECONCILIATION_ENABLED:
      CONTROL_PURGE_ENABLED:
      CONTROL_OUTBOX_PROBE_ENABLED:

      # Sicherungen: Verwaltung <-> Backup-Agent (nur im Compose-Netz). Die
      # Verwaltung signiert ihre Anfragen mit BACKUP_AGENT_SECRET; der Agent
      # meldet fertige Sicherungen mit BACKUP_REPORT_KEY an /api/backups.
      # install.sh erzeugt beide Werte (und AGENT_STATE_KEY fuer den Agenten).
      BACKUP_AGENT_URL: ${BACKUP_AGENT_URL:-http://backup-agent:8787}
      BACKUP_AGENT_SECRET: ${BACKUP_AGENT_SECRET:?BACKUP_AGENT_SECRET muss gesetzt sein}
      BACKUP_REPORT_KEY: ${BACKUP_REPORT_KEY:?BACKUP_REPORT_KEY muss gesetzt sein}
      # Der Agent sendet x-backup-key = BACKUP_REPORT_KEY; der Guard der
      # Verwaltung vergleicht mit CONTROL_BACKUP_KEY. Beide sind derselbe Wert
      # (kein zweites Geheimnis).
      CONTROL_BACKUP_KEY: ${BACKUP_REPORT_KEY:?BACKUP_REPORT_KEY muss gesetzt sein}

      # Rechnungen: Preistafel, Datumsfenster, Ausstellerangaben.
      CONTROL_PRICE_TABLE:
      CONTROL_INVOICE_DATE_RETROACTIVE_DAYS:
      CONTROL_INVOICE_DATE_AHEAD_DAYS:
      CONTROL_INVOICE_ISSUER:
      CONTROL_INVOICE_STREET:
      CONTROL_INVOICE_POSTAL_CODE:
      CONTROL_INVOICE_CITY:
      CONTROL_INVOICE_COUNTRY:
      CONTROL_INVOICE_SEAT:
      CONTROL_INVOICE_USTIDNR:
      CONTROL_INVOICE_CREDITOR_ID:
      CONTROL_INVOICE_COMMERCIAL_REGISTER_A:
      CONTROL_INVOICE_REGISTER_COURT:
      CONTROL_INVOICE_GENERAL_PARTNER:
      CONTROL_INVOICE_GENERAL_PARTNER_SEAT:
      CONTROL_INVOICE_GENERAL_PARTNER_GERICHT:
      CONTROL_INVOICE_COMMERCIAL_REGISTER_B:
      CONTROL_INVOICE_MANAGING_DIRECTOR:
      CONTROL_INVOICE_CONTACT_NAME:
      CONTROL_INVOICE_PHONE:
      CONTROL_INVOICE_EMAIL:
      CONTROL_INVOICE_BANK:
      CONTROL_INVOICE_IBAN:
      CONTROL_INVOICE_BIC:
      CONTROL_INVOICE_LEGAL_ADDITION:
      # Rechnungsdienst (Dienst invoice-renderer, nur im Compose-Netz). Nicht
      # gesetzt = der Dienst unten; ausdrücklich leer = PDF-Erzeugung aus.
      RECHNUNGSDIENST_URL: ${RECHNUNGSDIENST_URL-http://invoice-renderer:8080}

      # E-Mail: Absender, Zustellbarkeit, Rundmail, Einwilligung.
      MAIL_DOMAIN:
      MAIL_SENDER_INVOICE:
      MAIL_SENDER_BROADCAST:
      MAIL_REPLY_TO:
      MAIL_RETURN_PATH:
      MAIL_UNSUBSCRIBE_MAILTO:
      CONTROL_MAIL_BASE_URL:
      CONTROL_CONSENT_CLEANUP:
      CONTROL_BROADCAST_ENABLED:
      CONTROL_BROADCAST_PER_RUN:
      CONTROL_BROADCAST_INTERVAL_MS:
      CONTROL_BROADCAST_RETRY_MINUTES:

      # Zugangsdaten der öffentlichen Demo (gehen bei einer Demo-Anfrage hinaus).
      DEMO_URL:
      DEMO_LOGIN_USER:
      DEMO_LOGIN_PASS:
    volumes:
      # Manifest dieser Verwaltung (install.sh setzt MANIFEST_FILE).
      - ${MANIFEST_FILE:-./saas-instant.manifest.example.yaml}:/app/saas-instant.manifest.yaml:ro
    # Weg zu einer Coolify-API auf dem Host (nur relevant, wenn sie dort lauscht).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      control-db:
        condition: service_healthy
    restart: unless-stopped

  # Rechnungsdienst: erzeugt PDF/A-3b mit eingebettetem ZUGFeRD-XML. Nur im
  # Compose-Netz erreichbar (kein ports:), die API ruft ihn über
  # RECHNUNGSDIENST_URL auf. Das Image läuft als unprivilegierter Benutzer.
  # Fällt er aus, melden nur die Dokumentrouten einen Fehler (502).
  invoice-renderer:
    build:
      context: ./tools/invoice-renderer
    expose:
      - "8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Backup-Agent: verschluesselte Sicherungen der Instanzen und der Verwaltung.
  # Kein Port nach aussen; erreichbar nur fuer control-api im Compose-Netz
  # (HMAC-signiert, siehe apps/backup-agent). Docker-Zugriff ausschliesslich
  # ueber den docker-socket-proxy (Allowlist), nie ueber den Socket selbst.
  # Der Agent loescht keine Instanzen und keine Datenbanken; Rechnungsarchive
  # (invoices/*) loescht er nie (HARTE REGEL R1).
  backup-agent:
    build:
      context: .
      dockerfile: apps/backup-agent/Dockerfile
    environment:
      TZ: ${APP_TIMEZONE:-Europe/Berlin}
      PORT: "8787"
      STATE_DIR: /state
      WORK_DIR: /state/work
      BACKUP_AGENT_SECRET: ${BACKUP_AGENT_SECRET:?BACKUP_AGENT_SECRET muss gesetzt sein}
      AGENT_STATE_KEY: ${AGENT_STATE_KEY:?AGENT_STATE_KEY muss gesetzt sein}
      BACKUP_REPORT_KEY: ${BACKUP_REPORT_KEY:?BACKUP_REPORT_KEY muss gesetzt sein}
      CONTROL_URL: http://control-api:3001
      # Nur fuer pg_dump, und mit einer eigenen Rolle, die nur lesen darf
      # (ops/control-db/backup-agent-role.sql), nicht als Superuser `control`.
      CONTROL_DATABASE_URL: postgresql://backup_agent:${BACKUP_DB_PASSWORD:?BACKUP_DB_PASSWORD fehlt in der .env - install.sh erneut ausfuehren}@control-db:5432/control
      # Aufbewahrung der Rechnungsarchive (Object Lock) kommt aus dem
      # Sicherungsplan der Verwaltung (retentionYears); nur Rueckfall, falls der
      # Plan sie nicht liefert. Ungesetzt = 10 Jahre.
      INVOICE_RETENTION_YEARS:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # Projektname dieses Stacks: Wiederherstellung dorthin ist ausgeschlossen.
      AGENT_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-}
      # Weitere Stacks, die nie Restore-Ziel sind (kommagetrennt, `*` am Ende =
      # Praefix). Eingebaut ist saas-instant-* (Verwaltungen, Portal, portal-auth).
      RESTORE_DENY_PROJECTS: ${RESTORE_DENY_PROJECTS:-}
      # Zeitlimit je Auftrag in Minuten (Sicherung, Wiederherstellung, Pruefung).
      JOB_TIMEOUT_MINUTES: ${JOB_TIMEOUT_MINUTES:-120}
    volumes:
      - backup-agent-state:/state
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - docker-api
    depends_on:
      docker-socket-proxy:
        condition: service_started
      control-db-roles:
        condition: service_completed_successfully
    restart: unless-stopped

  # Einmalauftrag bei jedem Start: legt die schreibgeschuetzte Rolle backup_agent
  # in der Verwaltungsdatenbank an bzw. gleicht sie an (idempotent). Laeuft mit dem
  # Datenbank-Superuser und beendet sich danach; der Agent wartet darauf.
  control-db-roles:
    image: postgres:16-alpine
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/roles/backup-agent-role.sql"]
    environment:
      PGHOST: control-db
      PGUSER: control
      PGDATABASE: control
      PGPASSWORD: ${CONTROL_POSTGRES_PASSWORD:?CONTROL_POSTGRES_PASSWORD muss gesetzt sein}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?BACKUP_DB_PASSWORD fehlt in der .env - install.sh erneut ausfuehren}
    volumes:
      - ./ops/control-db/backup-agent-role.sql:/roles/backup-agent-role.sql:ro
    depends_on:
      control-db:
        condition: service_healthy
    networks:
      - default
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Einziger Dienst mit Zugriff auf den Docker-Socket (nur lesend gemountet).
  # Allowlist in ops/docker-proxy/haproxy.cfg.template (eigene Regeln statt der
  # Schalter des Images: POST=1 + CONTAINERS=1 erlaubte auch /containers/create
  # und DELETE). Erlaubt sind nur: Container auflisten und ansehen, starten und
  # stoppen, Exec anlegen/starten/auslesen. Alles andere bekommt 403.
  # Lauscht nur im internen Netz docker-api, ohne ports:.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ops/docker-proxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    # Bewusst ohne read_only: der Entrypoint des Images schreibt beim Start
    # /usr/local/etc/haproxy/haproxy.cfg (aus der Vorlage); mit read_only
    # startet der Dienst in einer Neustartschleife. Der Schutz bleibt ueber
    # cap_drop, no-new-privileges, internes Netz und Allowlist.
    tmpfs:
      - /run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - docker-api
    restart: unless-stopped

  control-web:
    build:
      context: .
      dockerfile: apps/control/Dockerfile.web
      args:
        # Basisdomain der Instanzen für die Verweise in der Oberfläche. Wird beim
        # Bauen eingesetzt; install.sh übernimmt sie aus dem Manifest
        # (provisioning.instanceDomainBase). Leer = nur Subdomain, kein Verweis.
        VITE_INSTANCE_BASE_DOMAIN: ${CONTROL_INSTANCE_BASE_DOMAIN:-}
    ports:
      # Nur Loopback: control-web haengt X-Forwarded-For an, statt es zu
      # ueberschreiben. Von aussen direkt erreichbar waere die IP im Rate-Limit
      # und im Audit-Log frei waehlbar. Fuer den Betrieb im Netz steht ein
      # TLS-Proxy auf demselben Host davor (docs/installation.md, Abschnitt 5).
      - "${CONTROL_WEB_BIND:-127.0.0.1}:${CONTROL_WEB_PORT:-8080}:80"
    depends_on:
      - control-api
    restart: unless-stopped

volumes:
  control-db-data:
  backup-agent-state:

networks:
  # Internes Netz nur fuer den Weg Backup-Agent -> docker-socket-proxy
  # (internal: kein Zugang nach aussen, kein anderer Dienst haengt daran).
  docker-api:
    internal: true
