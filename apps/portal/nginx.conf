# Portal: statische Seite (Launcher, Anmeldeseiten) und Reverse-Proxy zum
# Anmeldedienst (portal-auth). Die Registry (Liste + Links) liegt als
# Verzeichnis-Mount (portal/registry/) unter /srv/registry.
#
# OHNE Anmeldedienst (ältere Installation) bleibt der Launcher benutzbar: der
# Docker-Name wird erst bei der Anfrage aufgelöst (Variable + resolver), nginx
# startet also auch, wenn portal-auth fehlt; /api liefert dann 502, und die
# Seite fällt auf die einfache Liste zurück.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portal_auth http://portal-auth:3100;

    # Kein Header-Include auf Serverebene: die Proxy-Orte unten setzen ihre
    # eigenen Sicherheits-Header (portal-auth/helmet); sonst gälten beide
    # Content-Security-Policy gleichzeitig, und die Abmeldeseite (iframes zu den
    # Verwaltungen) wäre blockiert.

    location = /registry.json {
        alias /srv/registry/registry.json;
        default_type application/json;
        include /etc/nginx/portal/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Anmeldedienst: Seiten-Logik der Anmeldung (JSON), OIDC und Schlüssel.
    location ^~ /api/ {
        include /etc/nginx/portal/proxy.conf;
        proxy_pass $portal_auth;
    }
    location ^~ /oauth/ {
        include /etc/nginx/portal/proxy.conf;
        proxy_pass $portal_auth;
    }
    location ^~ /.well-known/ {
        include /etc/nginx/portal/proxy.conf;
        proxy_pass $portal_auth;
    }

    # Seiten unter /auth/ (Anmeldung, Einrichtung, Konto, Konten und Zugriffe):
    # dieselbe statische Anwendung, die Route entscheidet clientseitig.
    location ^~ /auth/ {
        limit_except GET HEAD { deny all; }
        try_files /index.html =404;
        include /etc/nginx/portal/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
        include /etc/nginx/portal/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
