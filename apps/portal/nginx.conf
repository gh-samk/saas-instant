# Portal: statische Seite, keine Anmeldung, keine Kundendaten.
# Die Registry (Liste + Links) liegt als Verzeichnis-Mount unter /srv/registry.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/portal/security-headers.conf;

    location = /registry.json {
        alias /srv/registry/registry.json;
        default_type application/json;
        include /etc/nginx/portal/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
        include /etc/nginx/portal/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
