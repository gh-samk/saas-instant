# Zugriffslog OHNE Geheimnisse (Prüfung vom 13.09.2026).
#
# Vorher stand hier kein log_format: nginx schrieb das Standardformat mit der
# vollen Anfragezeile und dem vollen Referer. Damit landeten im Log, das
# Coolify jedem zeigt, der die Anwendung öffnen darf:
#   - der Notfall-Passwort- und der Notfall-Registrierungslink
#     (/emergency-password?token=…, /emergency-enrollment?token=…) — beide
#     vollwertige Kontouebernahme-Token;
#   - der Aufnahmelink (/api/intake/<token>, 14 Tage gueltig, fuehrt zur
#     Erfassung der Bankverbindung);
#   - Bestaetigungs- und Abmeldelink der Einwilligung
#     (/api/consent/{confirmation,unsubscribe}/<token>).
#
# Das Anwendungslog maskiert dieselben Pfade in src/common/log-masking.ts.
# WER DORT EINEN PFAD ERGAENZT, ERGAENZT IHN AUCH HIER. Vorbild ist
# apps/web/nginx.conf.

# Stufe 1: Query-String abschneiden (Notfall-Links). Bewusst $request_uri statt
# $uri: $uri ist nach try_files immer /index.html, das Log waere unbrauchbar.
map $request_uri $pfad_ohne_query {
    "~^(?<pfad>[^?]*)"  $pfad;
}

# Stufe 2: Token im PFAD ersetzen. Was hinter dem Token folgt, bleibt sichtbar
# (etwa /absenden) — es sagt, was versucht wurde, und ist kein Geheimnis.
map $pfad_ohne_query $pfad_ohne_geheimnis {
    default  $pfad_ohne_query;
    "~^(?<vorn>/(?:api/)?(?:intake|consent/(?:confirmation|unsubscribe)))/[^/]+(?<rest>/.*)?$"  "$vorn/<maskiert>$rest";
}

# Der REFERER traegt dieselben Geheimnisse weiter: Die Notfall-Seite laedt
# Skripte und Schriften, und jede dieser Anfragen nennt die Seite samt Token als
# Herkunft (strict-origin-when-cross-origin sendet same-origin die volle
# Adresse). Er wird deshalb genauso behandelt.
map $http_referer $referer_ohne_query {
    "~^(?<refpfad>[^?]*)"  $refpfad;
}
map $referer_ohne_query $referer_ohne_geheimnis {
    default  $referer_ohne_query;
    "~^(?<refvorn>https?://[^/]+/(?:api/)?(?:intake|consent/(?:confirmation|unsubscribe)))/[^/]+(?<refrest>/.*)?$"  "$refvorn/<maskiert>$refrest";
}

log_format ohne_geheimnisse '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $pfad_ohne_geheimnis $server_protocol" '
                            '$status $body_bytes_sent "$referer_ohne_geheimnis" "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log ohne_geheimnisse;

    # Die Verwaltung gehört in keinen Suchindex.
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/sicherheit.conf;

    # Upstream erst bei der Anfrage aufloesen ([A.21]) — sonst startet dieses
    # nginx nicht, wenn control-api fehlt, und die Oberflaeche ist ganz weg
    # statt nur ihre API.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # MUSS vor der SPA-Regel stehen: sonst fängt `try_files … /index.html` die
    # Datei ab und liefert die Anwendung mit 200 text/html aus (Finding W1).
    # Die Datei kommt aus apps/control/public/ und landet über den Vite-Build
    # im Wurzelverzeichnis; =404 statt Fallback, damit ein Fehlen auffällt.
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # TOKEN-ROUTEN: derselbe Proxy wie /api/, aber Fehlerlog erst ab `crit`.
    #
    # Das Fehlerlog von nginx laesst sich nicht formatieren. Scheitert der
    # Upstream (control-api startet neu, Name nicht aufloesbar), schreibt nginx
    # die VOLLE Anfragezeile hinein, samt Token. Gemessen am 13.09.2026: vier von
    # vier Test-Tokens standen dort, waehrend das Zugriffslog schon sauber war.
    # Ausfaelle der API bleiben ueber alle uebrigen /api/-Routen sichtbar.
    # Regex-Locations gehen Praefix-Locations vor; diese greift also zuerst.
    # X-FORWARDED-FOR: BEWUSST `$proxy_add_x_forwarded_for` (anhaengen), nicht
    # `$remote_addr` (ersetzen) und ohne real_ip-Direktiven. Die API liest die
    # Adresse NICHT von links (dort schreibt der Client), sondern zaehlt
    # CONTROL_TRUST_PROXY Stationen von RECHTS. Ein vorangestellter, gefaelschter
    # Eintrag landet damit links der gezaehlten Stationen und wird ignoriert:
    #   Compose (nur dieses nginx, CONTROL_TRUST_PROXY=1):  "gefaelscht, <client>"
    #     -> zaehlt den rechten Eintrag = echter Client.
    #   Coolify (Traefik -> dieses nginx, =2): "<client>, <traefik>" -> <client>.
    # Mit `$remote_addr` ginge hinter Traefik die Client-Adresse verloren, und
    # real_ip (set_real_ip_from) bedeutet, die Netzgrenze hier ein zweites Mal
    # von Hand zu pflegen. Sicher ist die Kette nur, solange CONTROL_TRUST_PROXY
    # nicht groesser ist als die Zahl der Proxys wirklich davor (siehe
    # docs/installation.md); der Test src/common/forwarded-for.spec.ts haelt
    # beides zusammen.

    location ~ ^/api/(?:intake|consent/(?:confirmation|unsubscribe))/ {
        error_log /var/log/nginx/error.log crit;
        set $control_ziel http://control-api:3001;
        proxy_pass $control_ziel$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Der Schlüssel des Sicherungs-Agents gehört nicht an den öffentlichen Rand (siehe /api/internal/).
        proxy_set_header x-backup-key "";
    }

    # FRONT-CHANNEL-LOGOUT (Anmeldung über das Portal). Das PORTAL bettet diese
    # Adresse in einem unsichtbaren iframe ein. Der globale Sicherheits-Snippet
    # (X-Frame-Options DENY, frame-ancestors 'none') würde das verbieten. Ein
    # eigenes `add_header` in dieser Location schaltet dessen Vererbung ab; die
    # Kopfzeilen der Antwort (CSP mit frame-ancestors NUR für das Portal) setzt
    # die API selbst, X-Frame-Options wird dort entfernt.
    location = /api/auth/sso/frontchannel-logout {
        add_header X-Robots-Tag "noindex, nofollow" always;
        set $control_ziel http://control-api:3001;
        proxy_pass $control_ziel$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Der Schlüssel des Sicherungs-Agents gehört nicht an den öffentlichen Rand (siehe /api/internal/).
        proxy_set_header x-backup-key "";
    }

    # INTERNE ROUTEN: nur für Dienste im Compose-Netz, nie über den öffentlichen Rand.
    # Der Sicherungs-Agent ruft control-api direkt auf (http://control-api:3001),
    # nicht über dieses nginx. Das Rechnungsarchiv (GET /api/internal/invoice-archive)
    # liefert ENTSCHLÜSSELTE Rechnungen allein gegen den statischen Header
    # x-backup-key; wer den Schlüssel einmal kennt, dürfte sie sonst von überall
    # abholen. `^~` schlägt die Regex-Routen oben und die Präfix-Route /api/ unten;
    # nginx normalisiert den Pfad (//, %2e) vor dem Vergleich.
    location ^~ /api/internal {
        return 404;
    }

    location /api/ {
        # Variable + $request_uri: siehe apps/web/nginx.conf.
        set $control_ziel http://control-api:3001;
        proxy_pass $control_ziel$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Der Schlüssel des Sicherungs-Agents gehört nicht an den öffentlichen Rand (siehe /api/internal/).
        proxy_set_header x-backup-key "";
    }
}
